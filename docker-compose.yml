services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: content_factory
      POSTGRES_USER: content_factory
      POSTGRES_PASSWORD: content_factory
    volumes:
      - ../koderevox-content-factory-data/postgres/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U content_factory -d content_factory"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - ../koderevox-content-factory-data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  api:
    build: .
    env_file: ../koderevox-content-factory-data/config/.env
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "8000:8000"
    volumes:
      - ../koderevox-content-factory-data/media:/data/media
      - ../koderevox-content-factory-data/renders:/data/renders
      - ../koderevox-content-factory-data/logs:/data/logs
      - ../koderevox-content-factory-data/capability-test-artifacts:/data/capability-test-artifacts
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
# End of Compose configuration.
  bot:
    build: .
    profiles: ["telegram"]
    env_file: ../koderevox-content-factory-data/config/.env
    environment:
      BACKEND_URL: http://api:8000
    command: ["python", "-m", "app.bot.main"]
    volumes:
      - ../koderevox-content-factory-data/media:/data/media
      - ../koderevox-content-factory-data/logs:/data/logs
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import os; os.kill(1, 0)'"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
  worker:
    build: .
    env_file: ../koderevox-content-factory-data/config/.env
    command: ["celery", "-A", "app.tasks.celery_app:celery_app", "worker", "--loglevel=INFO", "-Q", "default,media"]
    environment:
      HF_HOME: /data/models/huggingface
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
      STT_MODEL: small
      STT_DEVICE: cuda
      STT_COMPUTE_TYPE: float16
      VIDEO_ENCODER: h264_nvenc
    gpus: all
    volumes:
      - ../koderevox-content-factory-data/media:/data/media
      - ../koderevox-content-factory-data/renders:/data/renders
      - ../koderevox-content-factory-data/logs:/data/logs
      - ../koderevox-content-factory-data/capability-test-artifacts:/data/capability-test-artifacts
      - ../koderevox-content-factory-data/models:/data/models
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app:celery_app inspect ping -d celery@$$HOSTNAME --timeout 5"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  render-worker:
    build: .
    env_file: ../koderevox-content-factory-data/config/.env
    command: ["sh", "-c", "celery -A app.tasks.celery_app:celery_app worker --loglevel=INFO -Q render --concurrency=$${CELERY_RENDER_CONCURRENCY:-1} --hostname=render@%h"]
    gpus: all
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
      VIDEO_ENCODER: h264_nvenc
    volumes:
      - ../koderevox-content-factory-data/media:/data/media
      - ../koderevox-content-factory-data/renders:/data/renders
      - ../koderevox-content-factory-data/logs:/data/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app:celery_app inspect ping -d render@$$HOSTNAME --timeout 5"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  publish-worker:
    build: .
    env_file: ../koderevox-content-factory-data/config/.env
    command: ["sh", "-c", "celery -A app.tasks.celery_app:celery_app worker --loglevel=INFO -Q publish --concurrency=$${CELERY_PUBLISH_CONCURRENCY:-2} --hostname=publish@%h"]
    volumes:
      - ../koderevox-content-factory-data/media:/data/media
      - ../koderevox-content-factory-data/renders:/data/renders
      - ../koderevox-content-factory-data/logs:/data/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app:celery_app inspect ping -d publish@$$HOSTNAME --timeout 5"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
  publish-scheduler:
    build: .
    env_file: ../koderevox-content-factory-data/config/.env
    command: ["python", "-m", "app.tasks.scheduler"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import os; os.kill(1, 0)'"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
# End of Compose configuration.
