[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "koderevox-content-factory"
version = "0.3.0"
description = "Self-hosted AI content factory controlled through Telegram"
requires-python = ">=3.12"
dependencies = [
  "aiofiles>=24,<26",
  "aiogram>=3.15,<4",
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "celery[redis]>=5.4,<6",
  "beautifulsoup4>=4.12,<5",
  "fastapi>=0.115,<1",
  "faster-whisper>=1.1,<2",
  "httpx>=0.28,<1",
  "pillow>=11,<13",
  "pydantic-settings>=2.7,<3",
  "pypdf>=5,<7",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "structlog>=24.4,<26",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20,<1",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=1,<2",
  "ruff>=0.9,<1",
  "types-aiofiles>=24,<26",
]
[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_unused_ignores = true
